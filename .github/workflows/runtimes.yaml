# Does the bundle actually run on the Node versions the televisions have?
#
# check-syntax.js walks the AST and cannot see a module that does not resolve: `require('fs/promises')`
# passed every check on a machine running Node 24, and on the set the service died on its first
# require. So the bundle is loaded, for real. Locally the same matrix is `npm run test:matrix`.

name: Runtimes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest

    # Below the floor is reported, not enforced: a red mark for a runtime nothing uses gets ignored.
    continue-on-error: ${{ matrix.below_floor == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '12.16.3'   # measured: Tizen 6.5
          - node: '14.21.3'
          - node: '16.20.2'
          - node: '18.18.2'   # measured: Tizen 9.0
          - node: '20.18.1'
          - node: '22.12.0'

    steps:
      - uses: actions/checkout@v4

      # Built with the repo's own toolchain; only the running of it is done on the old runtime.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Load and answer on node ${{ matrix.node }}
        run: node service/test/smoke.js
