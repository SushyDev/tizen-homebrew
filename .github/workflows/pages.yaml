# Adding an app is a commit to catalog/: the channel fetches this at runtime, so nothing is rebuilt.
#
# Needs Pages turned on once: Settings → Pages → Source: GitHub Actions.

name: Catalogue

on:
  push:
    branches: [main]
    paths: ['catalog/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits rather than cancelling: this publishes state, and the last write has to be newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the catalogue
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Malformed JSON empties the app list on every television, and the failure is silent from there.
      - name: Check the catalogue parses
        run: |
          node -e "
            const apps = require('./catalog/catalog.json');
            const list = Array.isArray(apps) ? apps : apps.apps;
            if (!Array.isArray(list)) throw new Error('catalog.json must be an array, or an object with an apps array.');
            list.forEach((entry, index) => {
              const named = entry && typeof entry.id === 'string' && typeof entry.name === 'string';
              const sourced = entry && entry.source && ['github', 'url'].includes(entry.source.type) && typeof entry.source.ref === 'string';
              if (!named || !sourced) throw new Error('Entry ' + index + ' is not a usable catalogue entry.');
              // Dropped by the service when it is not a string, leaving the app unable to update.
              if ('packageId' in entry && typeof entry.packageId !== 'string') {
                throw new Error('Entry ' + index + ' has a packageId that is not a string.');
              }
            });
            console.log(list.length + ' apps');
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog

      - id: deploy
        uses: actions/deploy-pages@v4
