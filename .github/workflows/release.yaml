# Builds the widget and opens a draft release for the tag that triggered it.
#
#   npm run version:set 1.2.0    # and commit
#   git tag v1.2.0 && git push origin v1.2.0
#
# Unsigned on purpose: a signature names one television, and Tizen Homebrew re-signs what it installs.
# Draft on purpose: GitHub refuses uploads to a published release, and publishing by hand is what
# makes `releases/latest` offer the update.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget:
    name: Build the widget
    runs-on: ubuntu-latest

    env:
      HOMEBREW_CATALOG_URL: ${{ vars.HOMEBREW_CATALOG_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # tizen.config.json holds a bare MAJOR.MINOR.PATCH, so v1.2.0-rc1 compares as 1.2.0.
          tagged="${GITHUB_REF_NAME#v}"
          tagged="${tagged%%-*}"
          declared="$(node -p "require('./tizen.config.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tizen.config.json, which says $declared."
            echo "Run 'npm run version:set $tagged', commit, and re-tag."
            exit 1
          fi

      - name: Versions agree
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # `--release` refuses a placeholder catalog URL; a prerelease may carry one.
      - name: Package
        env:
          STRICT: ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')) && '--release' || '' }}
        run: npm run package -- $STRICT

      - name: Name the widget after the version
        id: widget
        run: |
          version="$(node -p "require('./tizen.config.json').version")"
          name="tizen-homebrew-${version}.wgt"
          mv release/homebrew.wgt "release/${name}"
          echo "path=release/${name}" >> "$GITHUB_OUTPUT"

      - name: Open a draft release with it
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.widget.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload it as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tizen-homebrew-widget
          path: ${{ steps.widget.outputs.path }}
          if-no-files-found: error

  # The installer is what a person with nothing on their machine runs. Bun cross-compiles every
  # target from one runner, so this is a single job rather than a matrix.
  installers:
    name: Build the installers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2

      # The installer bundles this repository's own modules, and they bring jszip, tizen and forge.
      - name: Install
        run: npm ci

      - name: Install the installer's dependencies
        working-directory: installer
        run: bun install

      # Bundling resolves every platform's native import, so all of them have to be present even
      # though one runner is building. bun install honours os/cpu and skips them; npm --force does not.
      - name: Fetch every platform's renderer
        working-directory: installer
        run: npm run natives

      - name: Build
        working-directory: installer
        run: |
          set -eu
          mkdir -p dist

          build() {
            bun build --compile --minify --target="$1" src/main.ts --outfile "dist/$2"
          }

          build bun-darwin-arm64  tizen-homebrew-installer-macos-arm64
          build bun-darwin-x64    tizen-homebrew-installer-macos-x64
          build bun-linux-x64     tizen-homebrew-installer-linux-x64
          build bun-linux-arm64   tizen-homebrew-installer-linux-arm64
          build bun-windows-x64   tizen-homebrew-installer-windows-x64

          ls -la dist

      - name: Attach them to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: installer/dist/tizen-homebrew-installer-*
          fail_on_unmatched_files: true

      - name: Upload them as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tizen-homebrew-installers
          path: installer/dist/tizen-homebrew-installer-*
          if-no-files-found: error
