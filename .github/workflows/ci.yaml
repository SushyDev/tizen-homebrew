# Everything that can be checked without a television.
#
# The build runs here because `ui/build.js` refuses CSS a Tizen webview would silently drop.
#
# check-syntax.js walks the AST and cannot see a module that does not resolve: `require('fs/promises')`
# passed every check on a machine running Node 24, and on the set the service died on its first
# require. So `runtimes` loads the built bundle for real, on each Node a television is known to run.
# Locally the same matrix is `npm run test:matrix`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Versions agree
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The bundle is self-contained, so it is the whole of what the matrix below needs.
      - uses: actions/upload-artifact@v4
        with:
          name: service-bundle
          path: service/dist
          retention-days: 1
          if-no-files-found: error

  runtimes:
    name: node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest

    # Below the floor is reported, not enforced: a red mark for a runtime nothing uses gets ignored.
    continue-on-error: ${{ matrix.below_floor == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '12.16.3'   # measured: Tizen 6.5
          - node: '14.21.3'
          - node: '16.20.2'
          - node: '18.18.2'   # measured: Tizen 9.0
          - node: '20.18.1'
          - node: '22.12.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: service-bundle
          path: service/dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Load and answer on node ${{ matrix.node }}
        run: node service/test/smoke.js
